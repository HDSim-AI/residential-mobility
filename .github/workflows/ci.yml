name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # hdsim is not on PyPI yet, so the method core is installed from source.
  HDSIM_CORE: "hdsim @ git+https://github.com/HDSim-AI/hdsim@main"

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install "$HDSIM_CORE"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  wheel:
    name: wheel installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      # An editable install leaves the source tree on disk, so an undeclared data file still
      # resolves and nothing fails. travel-decision shipped a wheel that could not be imported
      # for exactly this reason. Install the built wheel and import it from outside the repo.
      - name: Import the built wheel from outside the repo
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install "$HDSIM_CORE"
          /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/python -c "import hdsim.core, hdsim.mobility; from hdsim.mobility import load_example; print(len(load_example().members), 'members')"
